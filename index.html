<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment Knowledge Club</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app-shell mx-auto">

    <!-- STATUS BAR -->
    <div class="status-bar d-flex justify-content-between align-items-center px-3">
      <span class="status-time">9:41</span>
      <div class="status-icons d-flex gap-2 align-items-center">
        <i class="bi bi-reception-4"></i>
        <i class="bi bi-wifi"></i>
        <i class="bi bi-battery-full"></i>
      </div>
    </div>

    <!-- HERO -->
    <section class="hero-section text-center px-3 pt-3 pb-4">
      <div class="avatar-wrapper mx-auto mb-2">
        <img
          src="images/profile.jpg"
          alt="Michael"
          class="avatar-img"
          onerror="this.src='https://ui-avatars.com/api/?name=Michael&background=c8a951&color=fff&size=80'"
        />
      </div>
      <h2 class="hero-name mb-1">Michael</h2>
      <p class="hero-subtitle mb-0">
        You've officially joined<br />
        your first investment<br />
        knowledge club!
      </p>
    </section>

    <!-- LEADERBOARD GRID -->
    <section class="leaderboard-section px-3 pb-3">
      <div class="row g-2">

        <div class="col-6">
          <div class="lb-card d-flex align-items-center gap-2 p-2">
            <img src="images/benard.jpg" alt="Benard Makodingo" class="lb-avatar"
              onerror="this.src='https://ui-avatars.com/api/?name=Benard+Makodingo&background=3a3a3a&color=fff&size=40'" />
            <div>
              <div class="lb-name">Benard<br />Makodingo</div>
              <div class="lb-score">350</div>
            </div>
          </div>
        </div>

        <div class="col-6">
          <div class="lb-card d-flex align-items-center gap-2 p-2">
            <img src="images/kigsmall.jpg" alt="kigSmall Foot" class="lb-avatar"
              onerror="this.src='https://ui-avatars.com/api/?name=kig+Small&background=c8a951&color=fff&size=40'" />
            <div>
              <div class="lb-name">kigSmall<br />Foot</div>
              <div class="lb-score">225</div>
            </div>
          </div>
        </div>

        <div class="col-6">
          <div class="lb-card d-flex align-items-center gap-2 p-2">
            <img src="images/caroline1.jpg" alt="Caroline Likhol" class="lb-avatar"
              onerror="this.src='https://ui-avatars.com/api/?name=Caroline+Likhol&background=3a3a3a&color=fff&size=40'" />
            <div>
              <div class="lb-name">Caroline<br />Likhol</div>
              <div class="lb-score">117</div>
            </div>
          </div>
        </div>

        <div class="col-6">
          <div class="lb-card d-flex align-items-center gap-2 p-2">
            <img src="images/caroline2.jpg" alt="Caroline Likhol" class="lb-avatar"
              onerror="this.src='https://ui-avatars.com/api/?name=C+Likhol&background=5a5a5a&color=fff&size=40'" />
            <div>
              <div class="lb-name">Caroline<br />Likhol</div>
              <div class="lb-score">321</div>
            </div>
          </div>
        </div>

      </div>
    </section>

  </div>

  
<!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="js/app.js"></script>
</body>
</html>
